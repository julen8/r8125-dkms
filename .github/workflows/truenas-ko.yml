name: Build TrueNAS r8125 module

on:
  push:
    branches: ['**']
    tags: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout driver packaging
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select kernel and release tags
        id: target
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          kernel_tag=TS-25.04.1
          tagged=false
          if [[ "$REF_TYPE" == tag ]]; then
            kernel_tag="$REF_NAME"
            tagged=true
          else
            mapfile -t tags < <(git tag --points-at HEAD --list 'TS-*' | sort)
            if (( ${#tags[@]} > 1 )); then
              echo '::error::Multiple TS tags point at this commit; run the workflow on a specific tag.'
              exit 1
            elif (( ${#tags[@]} == 1 )); then
              kernel_tag="${tags[0]}"
              tagged=true
            fi
          fi
          if [[ ! "$kernel_tag" =~ ^TS-[0-9][A-Za-z0-9._-]*$ ]]; then
            echo '::error::The pushed tag must be a TrueNAS kernel tag such as TS-25.04.2.'
            exit 1
          fi
          release_tag="$kernel_tag"
          if [[ "$tagged" == false ]]; then
            release_tag="ci-${kernel_tag}-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          printf 'kernel_tag=%s\nrelease_tag=%s\ntagged=%s\n' \
            "$kernel_tag" "$release_tag" "$tagged" >> "$GITHUB_OUTPUT"

      - name: Checkout matching TrueNAS kernel tag
        uses: actions/checkout@v4
        with:
          repository: truenas/linux
          ref: refs/tags/${{ steps.target.outputs.kernel_tag }}
          path: kernel
          persist-credentials: false

      - name: Free runner disk for kernel build
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          df -h "$GITHUB_WORKSPACE"

      - name: Build in Debian with GCC 14
        env:
          KERNEL_TAG: ${{ steps.target.outputs.kernel_tag }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            -e KERNEL_TAG -e GITHUB_SHA -e GITHUB_REPOSITORY \
            debian:trixie bash scripts/build-truenas-ko.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: r8125-${{ steps.target.outputs.kernel_tag }}-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.target.outputs.release_tag }}
          KERNEL_TAG: ${{ steps.target.outputs.kernel_tag }}
          TAGGED: ${{ steps.target.outputs.tagged }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            options=(--prerelease --latest=false)
            if [[ "$TAGGED" == true ]]; then
              options=(--verify-tag --latest=false)
            fi
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "r8125 for TrueNAS ${KERNEL_TAG}" \
              --notes-file dist/build-info.txt "${options[@]}"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
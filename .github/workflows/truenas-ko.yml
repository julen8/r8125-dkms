name: Build TrueNAS r8125 modules

on:
  push:
    branches: ['**']
    tags: ['**']
  workflow_dispatch:
    inputs:
      version:
        description: TrueNAS version from the manifest, or all
        default: all
        required: true
        type: string
      force_rebuild:
        description: Rebuild even when a verified published artifact exists
        default: false
        required: false
        type: boolean

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select build targets
        id: select
        env:
          SELECTED_VERSION: ${{ inputs.version || 'all' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys

          sys.path.insert(0, 'scripts')
          from truenas_artifacts import build_fingerprint

          with open('scripts/truenas-targets.json') as manifest:
              targets = json.load(manifest)
          selected = os.environ['SELECTED_VERSION']
          if selected != 'all' and selected not in targets:
              raise SystemExit(f'Unknown TrueNAS version: {selected}')
          entries = []
          for version, target in targets.items():
              if not re.fullmatch(r'[0-9][A-Za-z0-9._-]*', version):
                  raise SystemExit(f'Invalid version: {version}')
              if selected == 'all' or selected == version:
                  checksum = target['update_sha256']
                  if not re.fullmatch(r'[0-9a-f]{64}', checksum):
                      raise SystemExit(f'Invalid update SHA256: {version}')
                  entries.append({'version': version, 'container': target['container'],
                                  'update_sha256': checksum,
                                  'fingerprint': build_fingerprint(version, target)})
          if not entries:
              raise SystemExit('No build targets selected')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps({'include': entries}) + '\n')
          PY

  build:
    needs: targets
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout driver packaging
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reuse verified published artifacts
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TRUENAS_VERSION: ${{ matrix.version }}
          BUILD_FINGERPRINT: ${{ matrix.fingerprint }}
          FORCE_REBUILD: ${{ inputs.force_rebuild && 'true' || 'false' }}
        run: python3 scripts/truenas_artifacts.py restore

      - name: Cache official TrueNAS update
        if: steps.reuse.outputs.reused != 'true'
        uses: actions/cache@v4
        with:
          path: .build/truenas-${{ matrix.version }}/update.squashfs
          key: truenas-update-${{ runner.os }}-${{ matrix.version }}-${{ matrix.update_sha256 }}

      - name: Build against official update headers
        if: steps.reuse.outputs.reused != 'true'
        env:
          TRUENAS_VERSION: ${{ matrix.version }}
          BUILD_CONTAINER: ${{ matrix.container }}
          BUILD_FINGERPRINT: ${{ matrix.fingerprint }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            -e TRUENAS_VERSION -e GITHUB_SHA -e GITHUB_REPOSITORY \
            -e BUILD_FINGERPRINT \
            "$BUILD_CONTAINER" bash scripts/build-truenas-ko.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: r8125-TrueNAS-${{ matrix.version }}
          path: dist/${{ matrix.version }}/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: r8125-TrueNAS-*
          path: dist
          merge-multiple: true
      - name: Publish complete GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_tag="ci-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          options=(--latest=false)
          if [[ "$REF_TYPE" == tag ]]; then
            release_tag="$REF_NAME"
            options=(--verify-tag --latest=false)
          fi
          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo '::error::Release already exists; refusing to mix old and new artifacts.'
            exit 1
          fi
          for checksums in dist/*.SHA256SUMS; do
            (cd dist && sha256sum --check "${checksums#dist/}")
          done
          printf 'r8125 modules built against official TrueNAS update headers.\n\n' > release-notes.txt
          for info in dist/*.txt; do
            sed '/^alias:/d' "$info" >> release-notes.txt
            printf '\n' >> release-notes.txt
          done
          gh release create "$release_tag" dist/* \
            --draft \
            --target "$GITHUB_SHA" \
            --title "r8125 TrueNAS modules: $release_tag" \
            --notes-file release-notes.txt "${options[@]}"
          gh release edit "$release_tag" --draft=false --latest=true